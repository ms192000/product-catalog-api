# Production nginx: TLS termination plus the caching reverse proxy.
#
# The caching rules are the same ones explained in deploy/nginx.conf; the
# additions here are TLS, an HTTP->HTTPS redirect, the ACME challenge path, and
# security headers.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/json;

  # Log the cache status on every line. Without it you cannot tell whether the
  # cache is working from the logs alone, which is the first question during an
  # incident.
  log_format  cached  '$remote_addr - $status "$request" '
                      'cache=$upstream_cache_status rt=$request_time urt=$upstream_response_time';
  access_log  /var/log/nginx/access.log cached;

  sendfile        on;
  tcp_nopush      on;
  server_tokens   off;   # Do not advertise the nginx version to scanners.
  keepalive_timeout 65;

  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 512;
  gzip_vary on;

  proxy_cache_path /var/cache/nginx/catalog
                   levels=1:2
                   keys_zone=catalog:10m
                   max_size=500m
                   inactive=60m
                   use_temp_path=off;

  upstream api {
    server api:3000;
    keepalive 32;
  }

  # Port 80 exists only to answer ACME challenges and to redirect. Serving the
  # API over plaintext would mean the API key travels in the clear.
  server {
    listen 80;
    listen [::]:80;
    server_name nike-catalog.me www.nike-catalog.me;

    # Must stay on HTTP and must not redirect — Let's Encrypt fetches this path
    # over port 80 to prove domain control.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nike-catalog.me www.nike-catalog.me;

    ssl_certificate     /etc/letsencrypt/live/nike-catalog.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nike-catalog.me/privkey.pem;

    # TLS 1.2 as the floor. 1.0/1.1 are deprecated and fail a security review;
    # 1.2 keeps older clients working.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling is deliberately not enabled. Let's Encrypt stopped including
    # an OCSP responder URL in its certificates, so `ssl_stapling on` does nothing
    # except log a warning on every reload. Revocation is handled by short
    # certificate lifetimes instead.
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Health and readiness are proxied explicitly and never cached. A cached
    # readiness probe reports the state of a process that may have died since.
    location = /health {
      proxy_pass http://api;
      proxy_cache off;
      access_log off;
      add_header X-Cache-Status "BYPASS" always;
    }

    location = /ready {
      proxy_pass http://api;
      proxy_cache off;
      access_log off;
      add_header X-Cache-Status "BYPASS" always;
    }

    location /api/ {
      proxy_pass http://api;

      proxy_cache catalog;
      # The query string is part of the key, so every filter combination caches
      # separately.
      proxy_cache_key "$request_method$scheme$host$request_uri";
      proxy_cache_methods GET HEAD;

      proxy_cache_valid 200 301 302 60s;
      proxy_cache_valid 404 10s;

      # One request repopulates an expired entry; the rest wait for it rather
      # than all stampeding the origin at once.
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;

      # Keep serving the stale copy while refreshing, and keep serving it if the
      # origin is down. For a catalog, a 60-second-old price beats a 502.
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;

      # A write must not be served from cache, and must not be cached.
      proxy_cache_bypass $http_cache_control;
      proxy_no_cache     $http_authorization $http_x_api_key;

      add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- Static: the API reference -------------------------------------------
    # The deliverable is an API, so its front door is interactive documentation
    # rather than a storefront. Served by nginx directly, so it costs the
    # application nothing.
    root /usr/share/nginx/html;
    index index.html;

    # The bare domain serves the console directly — no redirect. It is the address
    # people are given, so it should be the thing itself.
    location = / {
      try_files /index.html =404;
      add_header Cache-Control "public, max-age=300" always;
    }

    location /reference/ {
      try_files $uri $uri/ /reference/index.html;
      # Short TTL: these pages are tiny, and it stops a stale build lingering
      # after a deploy.
      add_header Cache-Control "public, max-age=300" always;
    }

    # /docs was the previous address. 301 rather than deleting it, because it has
    # already been shared and a dead link is worse than a redirect.
    location = /docs {
      return 301 /reference/;
    }

    location = /docs/ {
      return 301 /reference/;
    }

    location = /openapi.yaml {
      # alias, because the spec is mounted outside the web root — see the compose
      # file for why it cannot live inside it.
      alias /etc/nginx/spec/openapi.yaml;
      # Not in nginx's default mime.types, and this server's default_type is
      # application/json — without this the spec is served as JSON and Swagger UI
      # has to guess.
      default_type application/yaml;
      add_header Cache-Control "public, max-age=300" always;
      add_header Access-Control-Allow-Origin "*" always;
    }

    # Anything unmatched is an API-shaped 404, since every real path is either
    # documented above or under /api/.
    location / {
      try_files $uri $uri/ @notfound;
    }

    location @notfound {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"No route matches this path. See /docs/"}}';
    }
  }
}
